<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <!-- Premium Dark Studio Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>

    <!-- Titanium Border Highlight -->
    <linearGradient id="metalEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#475569" stop-opacity="0.3" />
    </linearGradient>

    <!-- Premium Camera Lens Glass Gradient -->
    <radialGradient id="lensGlass" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="70%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Clean Glow Filter for Play Button -->
    <filter id="cleanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)" />

  <!-- 2. Clean iPhone Back View Chassis (Centered) -->
  <g transform="translate(490, 80)">
    <!-- Matte Phone Body (Space Gray/Titanium) -->
    <rect width="300" height="560" rx="52" fill="#1e293b" stroke="url(#metalEdge)" stroke-width="3" />
    
    <!-- Camera Bump Base (Top Left Layer) -->
    <rect x="20" y="20" width="130" height="130" rx="28" fill="#111827" opacity="0.9" stroke="#334155" stroke-width="1" />

    <!-- Top Left Lens -->
    <circle cx="55" cy="55" r="24" fill="url(#lensGlass)" stroke="#475569" stroke-width="1.5" />
    <circle cx="55" cy="55" r="10" fill="#020617" />
    <circle cx="52" cy="52" r="3" fill="#ffffff" opacity="0.3" /> <!-- Lens Reflection -->

    <!-- Bottom Left Lens -->
    <circle cx="55" cy="115" r="24" fill="url(#lensGlass)" stroke="#475569" stroke-width="1.5" />
    <circle cx="55" cy="115" r="10" fill="#020617" />
    <circle cx="52" cy="112" r="3" fill="#ffffff" opacity="0.3" />

    <!-- Right Centered Lens -->
    <circle cx="115" cy="85" r="24" fill="url(#lensGlass)" stroke="#475569" stroke-width="1.5" />
    <circle cx="115" cy="85" r="10" fill="#020617" />
    <circle cx="112" cy="82" r="3" fill="#ffffff" opacity="0.3" />

    <!-- Flash & LiDAR Sensors -->
    <circle cx="115" cy="45" r="8" fill="#e2e8f0" opacity="0.9" /> <!-- Flash -->
    <circle cx="115" cy="125" r="6" fill="#020617" stroke="#334155" stroke-width="1" /> <!-- LiDAR -->
  </g>

  <!-- 3. High-End Video Play Overlay (Perfect Center) -->
  <g transform="translate(640, 360)">
    <!-- Translucent Glass Ring -->
    <circle r="60" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-width="2" stroke-opacity="0.4" filter="url(#cleanGlow)" />
    <!-- Solid Minimalist Play Arrow -->
    <path d="M -10,-18 L 18,0 L -10,18 Z" fill="#ffffff" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" />
  </g>
</svg>
